##################################################################
#
#			CORE
#
##################################################################
# HTTP server port
server.port=53500
# Context path of the application
server.servlet.context-path=/auth
# Default HTTP session time out
server.servlet.session.timeout=15m

# jsp ViewResolver
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# log level
logging.level.root=INFO

# JMX unique names configuration
spring.jmx.default-domain=authDashboard
spring.jmx.unique-names=true 

#################################################################
#
#			JDBC DATA 
#
##################################################################
#Non-PROD Connectivity
spring.datasource.url=jdbc:sqlserver://EHVNHIPSDB.prod.services:55343;instanceName=EHVNHIPS;databaseName=EHVDHIPSCore;integratedSecurity=false
spring.datasource.username=HIPS_RW
spring.datasource.password=Rhapsody$N

# Hibernate extras
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
#hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
