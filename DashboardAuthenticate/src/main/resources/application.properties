#hips.report.hibernate.show_sql=true
#hips.report.hibernate.hbm2ddl.auto=none


###########################################
# user management
###########################################
sql.report.user.find=SELECT username, password, enabled, firstname, lastname, role FROM RHAP.REPORT_USERS WITH (NOLOCK) WHERE username = :username AND ENABLED = 1
sql.report.login.success=UPDATE RHAP.REPORT_USERS SET LOGINFAIL = 0, LOGINTIME = GETDATE() WHERE username = :username AND ENABLED = 1
sql.report.login.fail=UPDATE RHAP.REPORT_USERS SET LOGINFAIL = LOGINFAIL + 1 WHERE username = :username AND ENABLED = 1

